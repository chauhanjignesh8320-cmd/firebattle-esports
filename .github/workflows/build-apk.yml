name: Build & Publish Firebattle APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDK_MGR=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDK_MGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDK_MGR" ]; then
            echo "Using sdkmanager: $SDK_MGR"
            yes | "$SDK_MGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platform-tools" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "build-tools;36.0.0" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "build-tools;36.1.0" || true
          else
            echo "sdkmanager not found under $SDK_ROOT; relying on preinstalled SDK"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --no-configuration-cache --console=plain -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" 2>&1 | tee gradle_build.log; then
            echo "=== EXACT GRADLE ERROR SUMMARY ==="
            grep -A 30 "FAILURE:" gradle_build.log || tail -n 40 gradle_build.log
            exit 1
          fi

      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk Firebattle.apk

      - name: Upload Firebattle APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firebattle-Debug-APK
          path: Firebattle.apk
          if-no-files-found: error

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Firebattle Esports APK (Latest)
          body: Direct APK download for Firebattle Esports Player & Admin Android App.
          files: Firebattle.apk
          overwrite_files: true
          make_latest: true
