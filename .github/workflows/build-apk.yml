name: Build & Publish Firebattle APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDK_MGR=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDK_MGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDK_MGR" ]; then
            echo "Using sdkmanager: $SDK_MGR"
            yes | "$SDK_MGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platform-tools" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "build-tools;36.0.0" || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "build-tools;36.1.0" || true
          else
            echo "sdkmanager not found under $SDK_ROOT; relying on preinstalled SDK"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64 in repo."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          else
            echo "debug.keystore.base64 / DEBUG_KEYSTORE_BASE64 not set; generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          SHA1_LINE=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m 1 "SHA1:")
          echo "=== APK SIGNING FINGERPRINT ==="
          echo "$SHA1_LINE"
          {
            echo "### APK Signing SHA-1 Fingerprint"
            echo "\`\`\`"
            echo "$SHA1_LINE"
            echo "\`\`\`"
            echo "If Google Sign-In shows \`[16] Account reauth failed\`, add this SHA-1 in Firebase Console -> Project settings -> Your apps -> Add fingerprint."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check or restore Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "=== ERROR: app/google-services.json MISSING ==="
              echo "AI Studio's Push to GitHub excludes app/google-services.json."
              echo "Add a GitHub Actions Secret named GOOGLE_SERVICES_JSON containing your app/google-services.json file, or commit app/google-services.json directly in GitHub."
              ls -la app/
              exit 1
            fi
          else
            echo "Found app/google-services.json in repository."
          fi

          python3 - <<'PY'
          import base64
          import json
          import re
          import sys
          from pathlib import Path

          p = Path("app/google-services.json")
          raw = p.read_text(encoding="utf-8", errors="replace")
          text = raw.lstrip("\ufeff").strip()

          # Strip markdown code fences if accidentally copied
          if text.startswith("```"):
              lines = text.splitlines()
              if len(lines) >= 2 and lines[0].startswith("```"):
                  lines = lines[1:]
              if lines and lines[-1].strip().startswith("```"):
                  lines = lines[:-1]
              text = "\n".join(lines).strip()

          # Strip editor line numbers like "1: {" if accidentally copied
          if re.match(r"^\d+:\s*", text):
              text = "\n".join(re.sub(r"^\s*\d+:\s?", "", line) for line in text.splitlines()).strip()

          # Normalize smart quotes from mobile keyboards
          text = text.replace("\u201c", '"').replace("\u201d", '"')

          # Try base64 decode if not starting with '{'
          if text and not text.startswith("{"):
              try:
                  compact = re.sub(r"\s+", "", text)
                  decoded = base64.b64decode(compact, validate=True).decode("utf-8", errors="strict").lstrip("\ufeff").strip()
                  if decoded.startswith("{"):
                      text = decoded
              except Exception:
                  pass

          try:
              parsed = json.loads(text)
              if not isinstance(parsed, dict) or "project_info" not in parsed or "client" not in parsed:
                  raise ValueError("Missing required 'project_info' or 'client' keys in google-services.json")
              p.write_text(json.dumps(parsed, indent=2) + "\n", encoding="utf-8")
              print(f"Validated app/google-services.json ({len(text)} chars).")
          except Exception as e:
              first_char = repr(text[:1]) if text else "<EMPTY>"
              print("=== ERROR: app/google-services.json is not valid JSON ===")
              print(f"Diagnostics: raw_bytes={len(raw)}, cleaned_chars={len(text)}, starts_with={first_char}, reason={e}")
              print("Fix: Open GitHub Repo -> Settings -> Secrets and variables -> Actions -> GOOGLE_SERVICES_JSON, and paste the FULL content from '{' to '}'.")
              print("Tip: Or upload app/google-services.json directly into the app/ folder in your GitHub repository.")
              sys.exit(1)
          PY

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --no-configuration-cache --no-build-cache --console=plain -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" 2>&1 | tee gradle_build.log; then
            echo "=== EXACT GRADLE ERROR SUMMARY ==="
            grep -A 30 "FAILURE:" gradle_build.log || tail -n 40 gradle_build.log
            exit 1
          fi

      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk Firebattle.apk

      - name: Upload Firebattle APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firebattle-Debug-APK
          path: Firebattle.apk
          if-no-files-found: error

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Firebattle Esports APK (Latest)
          body: Direct APK download for Firebattle Esports Player & Admin Android App.
          files: Firebattle.apk
          overwrite_files: true
          make_latest: true
