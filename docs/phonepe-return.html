<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebattle — Completing Payment</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #141923;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.16);
      color: #10b981;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 22px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 18px;
      border-radius: 12px;
      background: #10b981;
      color: #07120e;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">FIREBATTLE WALLET</div>
    <h1>Returning to Firebattle App…</h1>
    <p id="statusText">Your payment is being verified automatically. Tap the button below if the app does not open in 2 seconds.</p>
    <a id="returnBtn" class="btn" href="firebattle://phonepe-return">Open Firebattle App</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('orderId') || '';
      var deepLink = orderId
        ? 'firebattle://phonepe-return?orderId=' + encodeURIComponent(orderId)
        : 'firebattle://phonepe-return';
      var btn = document.getElementById('returnBtn');
      if (btn) btn.href = deepLink;
      setTimeout(function () {
        window.location.href = deepLink;
      }, 250);
    })();
  </script>
</body>
</html>
